<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مثلثات">
<title>مثلثات دهم — فصل ۲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f1f3f9; color: #1e2340; direction: rtl;
    min-height: 100vh; padding-bottom: 90px;
  }
  .hidden { display: none !important; }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #a855f7);
    color: #fff; padding: 22px 18px 18px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 6px 20px rgba(79,70,229,.35);
    position: relative;
  }
  header h1 { font-size: 1.35rem; font-weight: 800; }
  header p { font-size: .85rem; opacity: .9; margin-top: 4px; }
  .back-btn {
    position: absolute; top: 18px; left: 16px;
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 1.2rem; cursor: pointer;
  }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px; }
  .menu-card {
    background: #fff; border-radius: 20px; padding: 20px 14px;
    text-align: center; cursor: pointer; border: none;
    box-shadow: 0 3px 12px rgba(30,35,64,.08);
    transition: transform .15s; font-family: inherit;
  }
  .menu-card:active { transform: scale(.96); }
  .menu-card .icon { font-size: 2.2rem; }
  .menu-card .title { font-weight: 800; margin-top: 8px; font-size: .95rem; color: #1e2340; }
  .menu-card .sub { font-size: .72rem; color: #8a90ad; margin-top: 3px; }
  .menu-card.c1 { background: linear-gradient(160deg,#eef2ff,#fff); }
  .menu-card.c2 { background: linear-gradient(160deg,#fdf4ff,#fff); }
  .menu-card.c3 { background: linear-gradient(160deg,#ecfeff,#fff); }
  .menu-card.c4 { background: linear-gradient(160deg,#fefce8,#fff); }
  .menu-card.c5 { background: linear-gradient(160deg,#f0fdf4,#fff); }
  .stats-bar {
    margin: 0 18px; background: #fff; border-radius: 16px;
    display: flex; justify-content: space-around; padding: 14px 8px;
    box-shadow: 0 3px 12px rgba(30,35,64,.08);
  }
  .stat { text-align: center; }
  .stat b { font-size: 1.15rem; color: #4f46e5; display: block; }
  .stat span { font-size: .72rem; color: #8a90ad; }
  .section { padding: 18px; }
  .lesson-list { display: flex; flex-direction: column; gap: 12px; }
  .lesson-item {
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 3px 12px rgba(30,35,64,.08);
  }
  .lesson-head {
    width: 100%; border: none; background: none; font-family: inherit;
    display: flex; align-items: center; gap: 12px;
    padding: 16px; cursor: pointer; text-align: right; font-size: .95rem;
  }
  .lesson-head .num {
    min-width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg,#4f46e5,#a855f7); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: .95rem;
  }
  .lesson-head .arrow { margin-right: auto; color: #b6bad0; transition: transform .25s; }
  .lesson-item.open .arrow { transform: rotate(90deg); }
  .lesson-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .lesson-item.open .lesson-body { max-height: 3000px; }
  .lesson-content { padding: 0 16px 18px; font-size: .9rem; line-height: 2; color: #3a3f5c; }
  .formula-box {
    background: #f5f3ff; border: 1px dashed #a78bfa; border-radius: 14px;
    padding: 12px 14px; margin: 10px 0; text-align: center;
    font-size: 1.05rem; font-weight: 700; color: #4c1d95; direction: ltr;
  }
  .formula-box .fa-note { direction: rtl; font-size: .78rem; font-weight: 400; color: #7c6bb0; margin-top: 6px; }
  .tip-box { background: #fffbeb; border-right: 4px solid #f59e0b; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .82rem; }
  .warn-box { background: #fef2f2; border-right: 4px solid #ef4444; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .82rem; }
  .ok-box { background: #f0fdf4; border-right: 4px solid #22c55e; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .82rem; }
  .lesson-content h3 { color: #4f46e5; font-size: 1rem; margin: 14px 0 6px; }
  .lesson-content h3:first-child { margin-top: 0; }
  .lesson-content ul { padding-right: 20px; }
  .lesson-content li { margin-bottom: 6px; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; line-height: 1.15; }
  .frac > span { display: block; padding: 0 4px; }
  .frac > span:first-child { border-bottom: 1.6px solid currentColor; }
  sup { font-size: .65em; }
  .rt { text-decoration: overline; padding: 0 1px; }
  .math-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .85rem; background:#fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(30,35,64,.06); }
  .math-table th, .math-table td { border: 1px solid #e6e8f2; padding: 8px 6px; text-align: center; }
  .math-table th { background: #eef2ff; color: #4338ca; }
  .math-table td.hl { color: #dc2626; font-weight: 700; }
  .circle-wrap { text-align: center; margin: 12px 0; }
  .circle-wrap svg { max-width: 100%; height: auto; }
  .flash-area { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .flash-counter { font-size: .85rem; color: #8a90ad; }
  .flash-card { width: 100%; max-width: 420px; min-height: 260px; perspective: 1200px; cursor: pointer; }
  .flash-inner { position: relative; width: 100%; min-height: 260px; transition: transform .5s; transform-style: preserve-3d; }
  .flash-card.flipped .flash-inner { transform: rotateY(180deg); }
  .flash-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 22px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
    box-shadow: 0 8px 24px rgba(30,35,64,.15);
  }
  .flash-front { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
  .flash-back { background: #fff; color: #1e2340; transform: rotateY(180deg); border: 2px solid #c7d2fe; }
  .flash-face .label { font-size: .75rem; opacity: .75; margin-bottom: 14px; }
  .flash-face .q { font-size: 1.3rem; font-weight: 800; }
  .flash-face .a { font-size: 1.25rem; font-weight: 800; direction: ltr; }
  .flash-face .a .fa-note { direction: rtl; font-size: .85rem; font-weight: 400; margin-top: 12px; color: #6b7194; }
  .flash-btns { display: flex; gap: 12px; width: 100%; max-width: 420px; }
  .btn { flex: 1; border: none; border-radius: 14px; padding: 14px; font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
  .btn-ghost { background: #fff; color: #4f46e5; border: 1.5px solid #c7d2fe; }
  .quiz-start { padding: 24px 18px; text-align: center; }
  .quiz-start h2 { font-size: 1.2rem; margin-bottom: 8px; }
  .quiz-start p { color: #6b7194; font-size: .88rem; line-height: 1.9; margin-bottom: 18px; }
  .quiz-progress { padding: 10px 18px 0; }
  .pbar { height: 8px; background: #e3e6f5; border-radius: 99px; overflow: hidden; }
  .pbar > div { height: 100%; background: linear-gradient(90deg,#4f46e5,#a855f7); border-radius: 99px; transition: width .3s; }
  .qcount { font-size: .78rem; color: #8a90ad; margin-bottom: 6px; text-align: center; }
  .quiz-body { padding: 18px; }
  .question-card { background: #fff; border-radius: 18px; padding: 20px 16px; box-shadow: 0 3px 12px rgba(30,35,64,.08); }
  .question-text { font-size: 1.05rem; font-weight: 700; line-height: 1.9; margin-bottom: 16px; }
  .option {
    display: block; width: 100%; text-align: right; font-family: inherit;
    background: #f7f8fd; border: 2px solid #e3e6f5; border-radius: 14px;
    padding: 13px 14px; margin-bottom: 10px; font-size: .95rem; cursor: pointer;
    transition: all .15s;
  }
  .option:active { transform: scale(.98); }
  .option.correct { background: #f0fdf4; border-color: #22c55e; color: #166534; font-weight: 700; }
  .option.wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b; font-weight: 700; }
  .option:disabled { cursor: default; }
  .explain-box { background: #eef2ff; border-radius: 14px; padding: 14px; margin-top: 6px; font-size: .85rem; line-height: 2; color: #3730a3; }
  .explain-box b { display: block; margin-bottom: 4px; }
  .next-btn { width: 100%; margin-top: 14px; }
  .result-card { background: #fff; border-radius: 22px; padding: 28px 20px; text-align: center; box-shadow: 0 3px 12px rgba(30,35,64,.08); }
  .result-emoji { font-size: 3rem; }
  .result-score { font-size: 2rem; font-weight: 800; color: #4f46e5; margin: 10px 0; }
  .result-msg { color: #6b7194; font-size: .9rem; line-height: 1.9; margin-bottom: 18px; }
  .calc-area { padding: 18px; }
  .calc-card { background: #fff; border-radius: 20px; padding: 20px 16px; box-shadow: 0 3px 12px rgba(30,35,64,.08); }
  .calc-card label { font-size: .85rem; color: #6b7194; display: block; margin-bottom: 8px; }
  .angle-input {
    width: 100%; font-family: inherit; font-size: 1.3rem; font-weight: 700;
    text-align: center; padding: 14px; border: 2px solid #e3e6f5; border-radius: 14px;
    color: #1e2340; outline: none; background: #f7f8fd;
  }
  .angle-input:focus { border-color: #7c3aed; }
  .quick-angles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
  .chip { border: 1.5px solid #c7d2fe; background: #eef2ff; color: #4338ca; border-radius: 99px; padding: 7px 14px; font-family: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; }
  .calc-results { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .res-item { background: #f7f8fd; border-radius: 14px; padding: 12px; text-align: center; }
  .res-item .name { font-size: .8rem; color: #8a90ad; }
  .res-item .val { font-size: 1.15rem; font-weight: 800; color: #4f46e5; direction: ltr; margin-top: 4px; }
  .res-item .val.undef { color: #dc2626; font-size: .9rem; }
  .quad-info { margin-top: 14px; background: #f0fdf4; border-radius: 14px; padding: 12px 14px; font-size: .85rem; color: #166534; text-align: center; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e6e8f2;
    display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-btn {
    border: none; background: none; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .68rem; color: #9aa0bd; padding: 4px 10px; border-radius: 12px;
  }
  .nav-btn .ic { font-size: 1.35rem; }
  .nav-btn.active { color: #4f46e5; font-weight: 700; background: #eef2ff; }
  @media (min-width: 640px) {
    .home-grid { max-width: 560px; margin: 0 auto; }
    .section, .quiz-body, .calc-area, .flash-area { max-width: 560px; margin: 0 auto; }
  }
</style>
</head>
<body>

</body>
</html>
